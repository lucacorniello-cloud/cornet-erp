services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cornet_erp
      POSTGRES_USER: cornet
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
